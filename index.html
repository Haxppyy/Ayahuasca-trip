<!doctype html>
<html lang="en">

<style>
  :root { --fg: #efe6d8; --dim: rgba(239,230,216,.55); --faint: rgba(239,230,216,.22); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--fg); }
  body { font-family: 'Inter', system-ui, sans-serif; font-weight: 300; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  body.idle { cursor: none; }

  /* start layer: nothing in the centre of the view, only quiet corner notes */
  #intro { position: fixed; inset: 0; z-index: 10; cursor: pointer; transition: opacity 2.5s ease, visibility 2.5s; }
  #intro.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  #intro .bl { position: absolute; left: 28px; bottom: 26px; max-width: min(420px, calc(100vw - 56px)); }
  #intro .br { position: absolute; right: 28px; bottom: 26px; display: flex; gap: 10px; }
  #intro .l1 { font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--fg); opacity: .8; }
  #intro .l2 { font-size: 12px; color: var(--dim); margin-top: 8px; letter-spacing: .04em; }
  #intro .l3 { font-size: 10.5px; line-height: 1.6; color: rgba(239,230,216,.32); margin-top: 14px; }
  .btn {
    background: rgba(0,0,0,.25); color: var(--fg); border: 1px solid var(--faint); backdrop-filter: blur(6px);
    font: 300 11px 'Inter', sans-serif; letter-spacing: .32em; text-transform: uppercase; padding: 13px 22px 13px 26px;
    cursor: pointer; border-radius: 999px; transition: border-color .5s, background .5s, opacity .5s;
  }
  .btn:hover:not(:disabled) { border-color: rgba(255,220,180,.7); background: rgba(255,220,180,.07); }
  .btn:disabled { opacity: .35; cursor: wait; }
  .btn[hidden] { display: none; }
  @media (max-width: 640px) {
    #intro .br { left: 28px; right: auto; bottom: auto; top: 26px; }
  }
  #keys { position: fixed; left: 28px; bottom: 24px; z-index: 6; font-size: 10.5px; letter-spacing: .06em; color: rgba(239,230,216,.35); opacity: 0; transition: opacity 2s; pointer-events: none; }
  #keys.show { opacity: 1; }
  kbd { font-family: inherit; border: 1px solid rgba(239,230,216,.2); border-radius: 4px; padding: 0 5px; margin: 0 1px; }
  #toast { position: fixed; top: 22px; right: 24px; z-index: 6; font-size: 10.5px; letter-spacing: .25em; text-transform: uppercase; color: var(--dim); opacity: 0; transition: opacity .6s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 14px; color: var(--dim); z-index: 20; background: #000; }
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { TexturePass } from 'three/addons/postprocessing/TexturePass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   SHADERS
   Every scene is rendered on the inside of a huge sphere and builds its
   view ray from (fragment world position - camera position), so the whole
   journey is a true 360° world you can look around in.
   ===================================================================== */

const VERT = /* glsl */`
varying vec3 vWorld;
void main(){ vec4 w = modelMatrix*vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }
`;

const COMMON = /* glsl */`
precision highp float;
varying vec3 vWorld;
uniform float uTime;
uniform float uWeight;
uniform float uOnset;
uniform float uIntensity;
uniform float uAudio;
uniform float uPixAng;     // radians per pixel
uniform float uEyeScale;   // world units per unit of camera movement
uniform float uQ;          // ray-march quality 0..1
uniform sampler2D uNoise;

#define PI  3.14159265359
#define TAU 6.28318530718

mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
vec3  hash33(vec3 p3){ p3 = fract(p3*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx)*p3.zyx); }

// texture-backed value noise (R = layer z, G = layer z+1)
float noise(vec3 x){
  vec3 p = floor(x); vec3 f = fract(x);
  f = f*f*(3.0 - 2.0*f);
  vec2 uv = (p.xy + vec2(37.0, 17.0)*p.z) + f.xy;
  vec2 rg = textureLod(uNoise, (uv + 0.5)/256.0, 0.0).rg;
  return mix(rg.x, rg.y, f.z);
}
const mat3 M3 = mat3(0.00, 0.80, 0.60, -0.80, 0.36, -0.48, -0.60, -0.48, 0.64);
float fbm(vec3 p){ float f = 0.0, a = 0.5; for(int i = 0; i < 5; i++){ f += a*noise(p); p = M3*p*2.03; a *= 0.5; } return f; }
float fbm3(vec3 p){ float f = 0.0, a = 0.5; for(int i = 0; i < 3; i++){ f += a*noise(p); p = M3*p*2.03; a *= 0.5; } return f; }

vec3 pal(float t, vec3 a, vec3 b, vec3 c, vec3 d){ return max(a + b*cos(TAU*(c*t + d)), 0.0); }
vec3 aya(float t){ return pal(t, vec3(.5,.45,.5), vec3(.5,.5,.5), vec3(1.), vec3(0.,.25,.55)); }
vec3 jewel(float t){ return pal(t, vec3(.45,.35,.5), vec3(.55,.45,.5), vec3(1.,.8,.9), vec3(.85,.2,.5)); }
vec3 starCol(float t){
  vec3 c = mix(vec3(1.0,.55,.32), vec3(1.0,.93,.84), smoothstep(0.0, 0.55, t));
  return mix(c, vec3(.62,.76,1.0), smoothstep(0.55, 1.0, t));
}

// view ray in a local frame where +z is "forward" (three.js looks down -z)
vec3 headDir(){ vec3 d = normalize(vWorld - cameraPosition); return vec3(d.x, d.y, -d.z); }
vec3 headPos(){ vec3 e = vec3(cameraPosition.x, cameraPosition.y, -cameraPosition.z)*uEyeScale; float l = length(e); return l > 0.45 ? e*(0.45/l) : e; }

vec4 finish(vec3 c){ return vec4(max(c, 0.0)*uWeight, 1.0); }

// faint field stars, pixel-accurate at any resolution
vec3 stars(vec3 rd){
  vec3 col = vec3(0.0);
  for(int i = 0; i < 3; i++){
    float fi = float(i);
    float sc = 60.0 + fi*90.0;
    vec3 id = floor(rd*sc);
    vec3 h = hash33(id + fi*31.7);
    float th = fi < 0.5 ? 0.9 : (fi < 1.5 ? 0.97 : 0.986);
    if(h.x < th) continue;
    vec3 sdir = normalize(id + 0.5 + (h.yzx - 0.5)*0.7);
    float d = length(cross(rd, sdir))/uPixAng;
    float mag = pow((h.x - th)/(1.0 - th), 8.0)*(1.0 - fi*0.3);
    float tw = 0.8 + 0.2*sin(uTime*(0.6 + 3.0*h.z) + h.y*TAU);
    col += starCol(h.z)*(exp(-d*d*0.8)*(0.025 + mag*2.5) + exp(-d*0.6)*mag*0.03)*tw;
  }
  return col;
}

// rare bright stars with telescope-like diffraction spikes (cube-face cells, spikes stay inside their cell)
vec3 brightStars(vec3 rd){
  vec3 a = abs(rd); vec2 f; float face;
  if(a.x >= a.y && a.x >= a.z){ f = rd.yz/a.x; face = rd.x > 0.0 ? 0.0 : 1.0; }
  else if(a.y >= a.z){ f = rd.xz/a.y; face = rd.y > 0.0 ? 2.0 : 3.0; }
  else { f = rd.xy/a.z; face = rd.z > 0.0 ? 4.0 : 5.0; }
  const float N = 3.0;
  vec2 g = f*N; vec2 id = floor(g);
  vec3 h = hash33(vec3(id, face) + 91.3);
  if(h.x < 0.45) return vec3(0.0);
  vec2 sp = id + 0.5 + (h.yz - 0.5)*0.3;
  float scl = 1.0/(N*(1.0 + dot(f, f)*0.5));
  vec2 o = (g - sp)*scl/uPixAng;
  float L = 0.3*scl/uPixAng;
  float r = length(o);
  float mag = pow((h.x - 0.45)/0.55, 2.5);
  float core = exp(-r*r*0.5)*2.5 + exp(-r*0.3)*0.25;
  float spk = 0.0;
  for(int k = 0; k < 3; k++){
    float an = float(k)*PI/3.0 + PI*0.5;
    vec2 dv = vec2(cos(an), sin(an));
    float al = abs(dot(o, dv)), pe = abs(dot(o, vec2(-dv.y, dv.x)));
    spk += exp(-pe*pe*0.7)*exp(-al/L*3.2);
  }
  spk += exp(-o.y*o.y*0.9)*exp(-abs(o.x)/L*6.0)*0.5;
  float tw = 0.9 + 0.1*sin(uTime*1.7 + h.y*20.0);
  return starCol(h.z)*mag*(core + spk*1.1)*tw;
}

// stereographic projection: conformal, forward = centre, behind = infinity
vec2 stereo(vec3 d){ return d.xy/(1.0 + d.z); }
`;

/* ---------- Scene 0: deep space (Void / Onset / Return) ---------- */
const DEEPSPACE = COMMON + /* glsl */`
uniform float uDrift;
uniform float uGalaxy;
uniform float uWarm;

const vec3 PDIR = vec3(-0.50, -0.22, 0.84);
const vec3 SUND = vec3(0.92, 0.28, 0.42);

vec3 milky(vec3 rd){
  vec3 n = normalize(vec3(0.25, 1.0, 0.35));
  float b = dot(rd, n);
  float band = exp(-b*b*10.0);
  if(band < 0.01) return vec3(0.0);
  float f = fbm(rd*3.0 + 1.0);
  float dust = smoothstep(0.45, 0.72, fbm(rd*8.0 + 5.0));
  vec3 c = mix(vec3(.30,.27,.42), vec3(.95,.78,.62), f);
  return c*band*(0.06 + 0.5*f*f)*(1.0 - dust*0.85)*0.45;
}

vec3 galaxy(vec3 rd){
  vec3 gd = normalize(vec3(0.42, 0.24, 1.0));
  if(dot(rd, gd) < 0.9) return vec3(0.0);
  vec3 t1 = normalize(cross(vec3(0.0, 1.0, 0.0), gd));
  vec3 t2 = cross(gd, t1);
  vec2 q = vec2(dot(rd, t1), dot(rd, t2))/0.16;
  q = rot(0.55)*q;
  q.y /= 0.42;
  float r = length(q);
  if(r > 1.6) return vec3(0.0);
  float a = atan(q.y, q.x);
  float arm = pow(0.5 + 0.5*cos(a*2.0 - log(r + 0.02)*3.3 + uTime*0.008), 2.5);
  float n  = fbm(vec3(q*5.0, 2.0));
  float n2 = noise(vec3(q*24.0, 5.0));
  float disk = exp(-r*3.0);
  vec3 col = vec3(1.0,.82,.6)*exp(-r*r*55.0)*4.0;
  col += vec3(1.0,.88,.72)*exp(-r*8.0)*0.7;
  col += mix(vec3(.5,.62,1.0), vec3(1.0,.78,.9), n)*disk*arm*(0.4 + n)*1.6;
  col += vec3(1.0,.32,.5)*disk*arm*smoothstep(0.66, 0.82, n2)*2.5;
  col *= 1.0 - 0.55*smoothstep(0.5, 0.7, n)*disk*(1.0 - arm);
  return col*smoothstep(1.6, 0.8, r)*0.9;
}

vec3 sunGlow(vec3 rd){
  float c = max(dot(rd, normalize(SUND)), 0.0);
  return vec3(1.0,.95,.88)*(smoothstep(0.99996, 0.99999, c)*60.0 + pow(c, 2000.0)*6.0 + pow(c, 90.0)*0.35 + pow(c, 8.0)*0.03);
}

float ringDen(float x){
  if(x < 1.28 || x > 2.36) return 0.0;
  float d = 0.6 + 0.4*sin(x*95.0 + noise(vec3(x*31.0, 0.5, 0.5))*4.0);
  d *= 0.7 + 0.6*noise(vec3(x*13.0, 2.5, 0.5));
  d *= smoothstep(1.28, 1.36, x)*smoothstep(2.36, 2.26, x);
  d *= mix(0.3, 1.0, smoothstep(1.45, 1.6, x));
  d *= 1.0 - 0.93*smoothstep(1.85, 1.88, x)*smoothstep(1.97, 1.94, x);   // Cassini division
  d *= 1.0 - 0.7*smoothstep(2.165, 2.175, x)*smoothstep(2.195, 2.185, x); // Encke gap
  return clamp(d, 0.0, 1.0);
}

// ringed gas giant lit by a distant sun
vec4 planet(vec3 rd){
  vec3 pd = normalize(PDIR);
  if(dot(rd, pd) < 0.86) return vec4(0.0);
  vec3 sun = normalize(SUND);
  float D = 400.0, R = 400.0*0.19;
  vec3 C = pd*D;
  vec3 pn = normalize(vec3(0.30, 1.0, -0.18));
  vec3 col = vec3(0.0); float alpha = 0.0;

  float b = dot(-C, rd); float c = dot(C, C) - R*R; float hd = b*b - c;
  float tP = hd > 0.0 ? -b - sqrt(hd) : 1e9;

  float dn = dot(rd, pn);
  float tR = abs(dn) > 1e-5 ? dot(C, pn)/dn : -1.0;
  vec4 ring = vec4(0.0);
  if(tR > 0.0){
    vec3 P = rd*tR;
    float x = length(P - C)/R;
    float dens = ringDen(x);
    if(dens > 0.0){
      vec3 rc = mix(vec3(.60,.52,.42), vec3(.92,.84,.70), noise(vec3(x*7.0, 1.0, 0.0)));
      vec3 so = P - C; float sb = dot(so, sun); float sh = sb*sb - (dot(so, so) - R*R);
      float shadow = (sh > 0.0 && sb < 0.0) ? 0.03 : 1.0;
      float lit = abs(dot(pn, sun));
      ring = vec4(rc*(0.04 + 0.75*lit)*shadow*(0.55 + 0.45*dens), clamp(dens*0.9, 0.0, 0.93));
    }
  }
  if(hd > 0.0 && tP > 0.0){
    vec3 P = rd*tP; vec3 N = (P - C)/R;
    vec3 e1 = normalize(cross(pn, vec3(0.0, 0.0, 1.0))); vec3 e2 = cross(pn, e1);
    float lat = dot(N, pn);
    float lon = atan(dot(N, e2), dot(N, e1)) + uTime*0.012;
    float cl = sqrt(max(1.0 - lat*lat, 0.0));
    vec3 sp = vec3(cos(lon)*cl, lat, sin(lon)*cl);
    float warp = fbm(sp*vec3(3.5, 13.0, 3.5) + 3.0);
    float bandc = lat*11.0 + (warp - 0.5)*1.7;
    float fine = noise(sp*vec3(22.0, 75.0, 22.0));
    vec3 alb = mix(vec3(.88,.80,.66), vec3(.64,.45,.30), smoothstep(-0.3, 0.6, sin(bandc*2.2)));
    alb = mix(alb, vec3(.96,.91,.82), smoothstep(0.55, 0.95, sin(bandc*5.1 + 1.0))*0.5);
    alb = mix(alb, vec3(.45,.36,.30), smoothstep(0.7, 1.0, sin(bandc*1.3 + 2.0))*0.35);
    alb *= 0.86 + 0.28*fine;
    float dl = mod(lon - 1.4 + PI, TAU) - PI;
    vec2 st = vec2(dl*1.3, (lat + 0.33)*4.0);
    float swirl = fbm(vec3(st*3.0, 1.0));
    alb = mix(alb, vec3(.78,.36,.22), exp(-dot(st, st)*26.0)*(0.6 + 0.4*swirl));
    float ndl = dot(N, sun);
    float diff = smoothstep(-0.06, 0.35, ndl)*clamp(ndl*0.8 + 0.25, 0.0, 1.0);
    float mu = max(dot(N, -rd), 0.0);
    vec3 pc = alb*diff*pow(mu, 0.3)*0.85;
    // ring shadow cast on the cloud tops
    float ts = dot(C - P, pn)/dot(sun, pn);
    if(ts > 0.0) pc *= 1.0 - 0.85*ringDen(length(P + sun*ts - C)/R);
    pc += alb*0.012;                                                     // ring-shine on the night side
    pc += vec3(.95,.78,.55)*pow(1.0 - mu, 4.0)*smoothstep(-0.25, 0.5, ndl)*0.35;
    col = pc; alpha = 1.0;
    if(ring.a > 0.0 && tR < tP) col = mix(col, ring.rgb, ring.a);
  } else if(ring.a > 0.0){
    col = ring.rgb; alpha = ring.a;
  }
  if(hd <= 0.0){
    float dmin = sqrt(max(dot(C, C) - b*b, 0.0));
    vec3 hp = normalize(rd*b - C);
    col += vec3(.95,.8,.62)*exp(-(dmin - R)/(R*0.012))*smoothstep(-0.3, 0.6, dot(hp, sun))*0.6;
  }
  return vec4(col, alpha);
}

// Emission nebula: H-II gas glowing in H-alpha / OIII, blue reflection dust around hot stars,
// opaque dust lanes with bright ionisation fronts on their edges and small dark Bok globules.
vec4 gas(vec3 p){
  vec3 q = p*0.085;
  vec2 w = vec2(fbm3(q*0.9 + vec3(1.7, 9.2, 0.0)), fbm3(q*0.9 + vec3(8.3, 2.8, 4.1)));
  q += vec3(w.x - 0.5, w.y - 0.5, w.x - w.y)*2.4;
  q += uOnset*0.15*vec3(sin(q.y*6.0 + uTime*0.5), sin(q.z*5.0 + uTime*0.43), sin(q.x*5.5 + uTime*0.37));
  float f = fbm(q);
  float ridge = pow(1.0 - abs(2.0*f - 1.0), 6.0);
  float big = smoothstep(0.32, 0.75, noise(p*0.02 + 3.0));
  float dens = (smoothstep(0.42, 0.82, f)*1.1 + ridge*0.5*smoothstep(0.3, 0.6, f))*big;
  float df = fbm3(q*2.3 + 4.0);
  float dust = smoothstep(0.5, 0.68, df)*smoothstep(0.35, 0.6, f)*big;
  float front = exp(-abs(df - 0.5)*12.0)*smoothstep(0.45, 0.7, f)*big;     // ionisation front on dust edges
  float glob = smoothstep(0.7, 0.92, fbm3(q*3.0 + 11.0))*big*0.8;          // Bok globules

  // hidden young stars lighting the gas around them
  vec3 cid = floor(p/16.0);
  vec3 hh = hash33(cid + 7.7);
  float sd = length(p - (cid + 0.5 + (hh - 0.5)*0.3)*16.0);
  float lum = step(0.72, hh.z)*(hh.z - 0.72)*3.6;
  float halo = lum*smoothstep(5.5, 0.0, sd);
  vec3 sCol = starCol(0.6 + 0.4*fract(hh.x*7.0));

  float h = noise(p*0.045 + 10.0);
  vec3 c = mix(vec3(.85,.10,.15), vec3(.10,.58,.70), smoothstep(0.42, 0.68, h));   // H-alpha -> OIII
  c = mix(c, vec3(.95,.55,.25), smoothstep(0.55, 0.8, w.x)*0.45);                   // SII / warm dust
  c = mix(c, vec3(.30,.45,1.0), halo*0.55);                                          // reflection blue near hot stars
  c = mix(c, jewel(h*2.0 + w.x + uTime*0.04), uOnset*0.6);
  c = mix(c, vec3(1.0,.58,.40), uWarm*0.3);

  float illum = 0.3 + halo*halo*4.0;
  vec3 em = c*dens*illum;
  em += mix(vec3(1.0,.62,.42), sCol, 0.5)*front*(0.05 + halo*1.2);
  em *= 1.0 - dust*0.92;
  em *= 1.0 - glob;
  return vec4(em, clamp(dens*0.5 + dust*0.55 + glob*0.7, 0.0, 0.96));
}

// a small cratered moon close to the gas giant
vec4 moon(vec3 rd){
  vec3 md = normalize(normalize(PDIR) + vec3(0.30, 0.16, 0.02));
  if(dot(rd, md) < 0.9995) return vec4(0.0);
  vec3 sun = normalize(SUND);
  float D = 300.0, R = 300.0*0.0115;
  vec3 C = md*D;
  float b = dot(-C, rd); float h = b*b - (dot(C, C) - R*R);
  if(h < 0.0) return vec4(0.0);
  vec3 N = (rd*(-b - sqrt(h)) - C)/R;
  float cr = fbm(N*6.0 + 2.0);
  float pits = smoothstep(0.62, 0.7, noise(N*14.0))*0.35;
  vec3 alb = vec3(.55,.53,.5)*(0.7 + 0.5*cr - pits);
  float ndl = dot(N, sun);
  vec3 col = alb*smoothstep(-0.02, 0.25, ndl)*max(ndl, 0.0)*1.1;
  return vec4(col, smoothstep(0.0, R*0.08, sqrt(h)));
}

vec3 render(){
  vec3 hd = headDir();
  float t0 = uTime;
  vec3 fw = normalize(vec3(sin(t0*0.013)*0.2, sin(t0*0.009)*0.1, 1.0));
  vec3 rt = normalize(cross(vec3(sin(t0*0.011)*0.15, 1.0, 0.0), fw));
  vec3 up = cross(fw, rt);
  vec3 rd = normalize(rt*hd.x + up*hd.y + fw*hd.z);
  vec3 hp = headPos();
  vec3 ro = vec3(sin(uDrift*0.031)*4.0, cos(uDrift*0.023)*3.0, uDrift) + rt*hp.x + up*hp.y + fw*hp.z;

  vec3 bg = stars(rd) + brightStars(rd) + milky(rd) + galaxy(rd)*uGalaxy + sunGlow(rd);
  vec4 mn = moon(rd);
  bg = bg*(1.0 - mn.a) + mn.rgb;
  vec4 pl = planet(rd);
  bg = bg*(1.0 - pl.a) + pl.rgb;

  if (!dragging) { yawV *= 0.94; pitchV *= 0.94; yaw += yawV * 0.5; pitch = Math.max(-1.45, Math.min(1.45, pitch + pitchV * 0.5)); }
  const drift = Math.sin(time * 0.42);
  camera.rotation.set(pitch + drift * 0.004 + Math.sin(time * 0.13) * 0.01, yaw + Math.sin(time * 0.07) * 0.015, Math.sin(time * 0.05) * 0.01);
  camera.position.set(0, drift * 0.015, 0);
  camera.fov = 70 + drift * 0.4 * s.intensity + s.zoom * 6;
  camera.updateProjectionMatrix();

  if (!paused) shared.uTime.value = time;
  shared.uOnset.value = s.onset;
  shared.uIntensity.value = s.intensity;
  shared.uGalaxy.value = s.galaxy;
  shared.uWarm.value = s.warm;
  shared.uAudio.value = Math.min(sound.level * 4, 1);
  for (let k = 0; k < 4; k++) { layers[k].material.uniforms.uWeight.value = s.w[k]; layers[k].visible = s.w[k] > 0.002; }
  overlay.material.uniforms.uWeight.value = s.onset; overlay.visible = s.onset > 0.002;

  shared.uQ.value = 1;
  shared.uPixAng.value = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) / sceneRT.height;

  // 1. the world (all active layers, additive crossfade)
  renderer.setRenderTarget(sceneRT);
  renderer.setClearColor(0x000000, 1);
  renderer.render(world, camera);
  // 2. tracers
  fbMat.uniforms.uCur.value = sceneRT.texture;
  fbMat.uniforms.uPrev.value = fbA.texture;
  fbMat.uniforms.uTrail.value = paused ? 0 : Math.min(0.35 + 0.4 * s.intensity, 0.75);
  fbMat.uniforms.uFlow.value = 0.4 + 1.6 * s.intensity;
  renderer.setRenderTarget(fbB); renderer.render(quadScene, quadCam);
  [fbA, fbB] = [fbB, fbA];
  renderer.setRenderTarget(null);
  // 3. lens, bloom, body
  texPass.map = fbA.texture;
  bloom.strength = 0.5 + 0.3 * s.intensity + s.flash * 1.5;
  finalPass.uniforms.uTime.value = time;
  finalPass.uniforms.uIntensity.value = s.intensity;
  finalPass.uniforms.uFlash.value = s.flash * 0.9;
  finalPass.uniforms.uZoom.value = s.zoom;
  composer.render(dt);
  return s;
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  step(dt);
  fpsFrames++; fpsTime += dt;
  if (fpsTime > 2.0) {
    const fps = fpsFrames / fpsTime; fpsFrames = 0; fpsTime = 0;
    window.__fps = fps;
    if (autoQuality) {
      if (fps < 40 && renderScale > 0.4) { renderScale = Math.max(0.4, renderScale - 0.07); resize(); }
      else if (fps > 57 && renderScale < 0.95) { renderScale = Math.min(0.95, renderScale + 0.04); resize(); }
    }
  }
}

// development helpers (benchmark + snapshot)
window.__set = (o) => { if (o.t != null) cycleT = o.t; if (o.q) { renderScale = o.q; resize(); } if (o.yaw != null) { yaw = o.yaw; pitch = o.pitch || 0; } };
window.__bench = (n = 10) => {
  const gl = renderer.getContext(), px = new Uint8Array(4);
  step(1 / 60); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const t0 = performance.now();
  for (let k = 0; k < n; k++) { step(1 / 60); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
  return (performance.now() - t0) / n;
};
window.__probe = (rt = 'scene') => {
  const target = rt === 'scene' ? sceneRT : fbA, out = {}, buf = new Uint16Array(4);
  for (const [k, fx, fy] of [['c', .5, .5], ['tl', .1, .9], ['br', .9, .1], ['m', .3, .6]]) {
    renderer.readRenderTargetPixels(target, Math.floor(target.width * fx), Math.floor(target.height * fy), 1, 1, buf);
    out[k] = Array.from(buf).slice(0, 3).map(v => +THREE.DataUtils.fromHalfFloat(v).toFixed(3));
  }
  return JSON.stringify(out);
};
window.__snap = async (t, frames = 10) => {
  if (t != null) cycleT = t;
  const gl = renderer.getContext(), px = new Uint8Array(4);
  for (let k = 0; k < frames; k++) { step(1 / 30); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); await new Promise(r => setTimeout(r, 5)); }
  let img = document.getElementById('__snap');
  if (!img) { img = document.createElement('img'); img.id = '__snap'; img.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:99'; document.body.appendChild(img); }
  img.src = renderer.domElement.toDataURL('image/jpeg', 0.9);
  return phaseState(cycleT).i;
};

// compile every shader before allowing entry, so transitions never hitch
function warmup() {
  const tiny = new THREE.WebGLRenderTarget(8, 8, rtOpts);
  const vis = [...layers, overlay].map(m => m.visible);
  [...layers, overlay].forEach(m => { m.visible = true; m.material.uniforms.uWeight.value = 0.001; });
  renderer.setRenderTarget(tiny);
  renderer.render(world, camera);
  renderer.render(quadScene, quadCam);
  renderer.setRenderTarget(null);
  [...layers, overlay].forEach((m, k) => { m.visible = vis[k]; });
  tiny.dispose();
}
setTimeout(() => {
  try { warmup(); } catch (e) { console.error(e); }
  ready = true;
  enterBtn.disabled = false; enterBtn.textContent = 'Begin';
  enterBtn.addEventListener('click', (e) => { e.stopPropagation(); begin(true); });
  clock.getDelta();
  if (params.has('noloop')) return;
  renderer.setAnimationLoop(frame);
}, 60);
</script>
</body>
